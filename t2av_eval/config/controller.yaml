# Text-only controller backends (t2av_eval.gate.controller). The media judge is Gemini only and does not read this file.
gemini:
  model: gemini-3.6-flash
  thinking: high
  temperature: 0.0
  seed: 42
  key_env: GEMINI_API_KEY
openai:             # third-controller experiment (lab account, user 11/02): the GPT-6 Astra tier
  model: gpt-6-astra          # the API has no dated snapshot for it
  model_listed: "2026-08-27"  # listing date of gpt-6-astra (recorded in every controller run README instead of a snapshot id)
  reasoning_effort: low       # the lowest effort the model accepts
  key_env: OPENAI_API_KEY
  service_tier: null          # no override: the account default
  # temperature / seed: not set (the model rejects temperature); the backend sends them only when set here
